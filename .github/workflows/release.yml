# Publishes to PyPI and npm through trusted publishing: the registries verify this workflow's
# OIDC identity, so there is no token in this repository and none on the maintainer's machine.
# Both registries must list owner `mesutcandemir39`, repo `humona`, workflow `release.yml`
# and (PyPI only) the `pypi` environment — a mismatch is refused, not silently published.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: which registry to publish to
        type: choice
        options: [both, pypi, npm]
        default: both

jobs:
  # Nothing is published before the suite passes and the version in the tag is the version the
  # manifests carry. A release that disagrees with itself is how a wrong version reaches users.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tests/test_humona.py
      - name: the tag must match the engine
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          engine=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' engine/humona.py)
          echo "tag=$tag engine=$engine"
          test "$tag" = "$engine"

  pypi:
    needs: verify
    if: inputs.target != 'npm'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write          # the OIDC token PyPI checks; no username/password is passed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build
      # Not `python -m build` at the root: the engine needs a checkout around it, so the wheel is
      # staged with its payload. See packaging/README.md.
      - run: python3 packaging/pypi/build.py -o dist
      # The wheel is what the user gets, so the wheel is what gets checked — not the checkout it
      # was built from. A fresh install has no hooks and no vault yet, exactly like a user's, so
      # the gate runs the installer the wheel carries and only then asks doctor.
      - name: the built wheel must pass its own doctor
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          payload=$(/tmp/wheelcheck/bin/python -c "import humona, pathlib; print(pathlib.Path(humona.__file__).parent / '_payload')")
          mkdir -p /tmp/wheelhome
          HOME=/tmp/wheelhome /tmp/wheelcheck/bin/python "$payload/setup/install.py"
          out=$(HOME=/tmp/wheelhome /tmp/wheelcheck/bin/humona doctor || true)
          echo "$out"
          echo "$out" | grep -q FAIL && { echo "::error::the wheel is not installable as a working engine"; exit 1; }
          echo "$out" | grep -q "checks passed"
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: verify
    if: inputs.target != 'pypi'
    runs-on: ubuntu-latest
    environment: npm          # the name npm's trusted publisher is registered with; both sides
    permissions:              # must say the same thing or the publish is refused
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # ships an npm new enough for OIDC; the floor is npm 11.5.1
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm install -g npm@latest
      # Not `npm publish` in packaging/npm: that directory holds the wrapper without the payload
      # the engine needs. The build stages both. See packaging/README.md.
      - name: the packed tarball must pass its own doctor
        run: |
          python3 packaging/npm/build.py -o dist
          npm install -g --prefix /tmp/npmcheck dist/humona-*.tgz
          mkdir -p /tmp/npmhome
          python3 /tmp/npmcheck/lib/node_modules/humona/_payload/setup/install.py
        env:
          HOME: /tmp/npmhome
      - run: HOME=/tmp/npmhome /tmp/npmcheck/bin/humona doctor | tee /tmp/npmdoctor
      - run: grep -q "checks passed" /tmp/npmdoctor && ! grep -q FAIL /tmp/npmdoctor
      - run: python3 packaging/npm/build.py --publish
