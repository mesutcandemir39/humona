# Publishes to PyPI and npm through trusted publishing: the registries verify this workflow's
# OIDC identity, so there is no token in this repository and none on the maintainer's machine.
# Both registries must list owner `mesutcandemir39`, repo `humona`, workflow `release.yml`
# and (PyPI only) the `pypi` environment — a mismatch is refused, not silently published.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: which registry to publish to
        type: choice
        options: [both, pypi, npm]
        default: both

jobs:
  # Nothing is published before the suite passes and the version in the tag is the version the
  # manifests carry. A release that disagrees with itself is how a wrong version reaches users.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tests/test_humona.py
      - name: the tag must match the engine
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          engine=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' engine/humona.py)
          echo "tag=$tag engine=$engine"
          test "$tag" = "$engine"

  pypi:
    needs: verify
    if: inputs.target != 'npm'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the OIDC token PyPI checks; no username/password is passed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build
      - run: python -m build
      # The wheel is what the user gets, so the wheel is what gets checked — not the checkout
      # it was built from. Today it would fail this: the package carries the module without the
      # hooks, skills and installer. That is exactly why the gate is here and not in a TODO.
      - name: the built wheel must pass its own doctor
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          out=$(HOME=/tmp/wheelhome /tmp/wheelcheck/bin/humona doctor || true)
          echo "$out"
          echo "$out" | grep -q FAIL && { echo "::error::the wheel is not installable as a working engine"; exit 1; }
          echo "$out" | grep -q "checks passed"
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: verify
    if: inputs.target != 'pypi'
    runs-on: ubuntu-latest
    environment: npm          # the name npm's trusted publisher is registered with; both sides
    permissions:              # must say the same thing or the publish is refused
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # ships an npm new enough for OIDC; the floor is npm 11.5.1
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
        working-directory: packaging/npm
