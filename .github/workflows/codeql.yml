# CodeQL, on a schedule rather than on every push. Actions is free on public repositories, so
# this is about signal, not minutes: the engine changes in bursts, and a monthly sweep plus a
# manual run before a release says as much as a scan per commit would.
name: codeql

on:
  schedule:
    - cron: "17 4 1 * *"   # 04:17 UTC on the 1st — off the hour, where the runner queue is shorter
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # writes the alerts into the Security tab
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]   # the engine, and the workflows themselves
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      # No build step: the engine is interpreted and has no dependencies to resolve.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
