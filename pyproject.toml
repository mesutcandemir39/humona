[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humona"
version = "3.0.0"
description = "Human-inspired memory for AI agents: a Markdown vault, git sync, zero dependencies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Mesut Can Demir" }]
keywords = ["humona", "memory", "claude", "claude-code", "agent", "obsidian", "hooks", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []   # the engine is standard library only, on purpose: hooks must start in ~0.1 s

[project.optional-dependencies]
semantic = ["fastembed>=0.3"]   # optional local embeddings; keyword search works without it

[project.scripts]
humona = "humona:main"
brain = "humona:main"   # alias kept for installs made before the 3.0 rename

[project.urls]
Homepage = "https://github.com/mesutcandemir39/humona"
Changelog = "https://github.com/mesutcandemir39/humona/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "engine" }
py-modules = ["humona"]
